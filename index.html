:root{
  --paper:#FAF5E6; --stock:#FFFDF2; --ink:#191409; --soft:#423C2D; --muted:#6E6650;
  --line:#E4DBC1; --line2:#CFC4A2;
  --red:#C9161D; --gold:#A87A0E; --slate:#46536E;
  --farm:#5D8A35; --souk:#2E7466; --house:#BE531C;
  --w1:#F2E7C8; --w2:#EDDFB6; --w3:#E7D4A0; --w4:#E0C988;
  --pos:#2E7466; --neg:#C9161D;
  --bg:var(--paper); --accent:var(--gold);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);
  font-family:'Thmanyah',-apple-system,system-ui,sans-serif;font-weight:500;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .35s ease;overflow:hidden;
  touch-action:manipulation;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  -webkit-user-select:none;user-select:none}
.ed{font-family:'ThmanyahSS01','Thmanyah',sans-serif}
.ar{direction:rtl;unicode-bidi:isolate}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
@media (prefers-reduced-motion:reduce){*,.sheet{transition:none!important;animation:none!important}}
.tnum{font-variant-numeric:tabular-nums}

body.m0{--bg:#EEF0F4;--accent:var(--slate)}
body.m1{--bg:#FAF5E6;--accent:var(--gold)}
body.m2{--bg:#FBF3DC;--accent:var(--gold)}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}

/* top bar */
.topbar{flex:none;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--bg);
  border-bottom:1px solid var(--line2);transition:background .35s ease}
.tbrow{display:flex;align-items:center;gap:8px;justify-content:space-between}
.brand{font-family:'ThmanyahSS01','Thmanyah',sans-serif;font-weight:900;font-size:19px;color:var(--red);direction:rtl}
.tbtools{display:flex;gap:6px}
.iconbtn{width:42px;height:42px;border-radius:11px;border:1px solid var(--line2);background:var(--stock);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--soft)}
.iconbtn:active{transform:scale(.93)}
.iconbtn[disabled]{opacity:.3}

.market{display:flex;gap:5px;margin-top:9px}
.mseg{flex:1;border-radius:11px;border:1.5px solid var(--line2);background:var(--stock);
  padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;transition:.18s}
.mseg .mw{font-family:'ThmanyahSS01','Thmanyah',sans-serif;font-weight:900;font-size:16px;direction:rtl;line-height:1}
.mseg .gp{font-size:10.5px;color:var(--muted);font-weight:700}
.mseg.on{border-width:2px}
.mseg.bust.on{background:var(--slate);border-color:var(--slate)}
.mseg.norm.on{background:var(--w1);border-color:var(--gold)}
.mseg.boom.on{background:var(--gold);border-color:var(--gold)}
.mseg.bust.on .mw,.mseg.boom.on .mw{color:var(--stock)}
.mseg.bust.on .gp,.mseg.boom.on .gp{color:rgba(255,253,242,.85)}
.metaline{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:11.5px;color:var(--muted);font-weight:700}
.metaline .rd{color:var(--soft)}
.metaline .rd b{font-weight:900}

/* content */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 12px 18px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 9px}
.sechead h2{font-size:16px;font-weight:900;color:var(--soft)}
.sechead .hint{font-size:11px;color:var(--muted);font-weight:600}

/* player cards */
.pcard{background:var(--stock);border:1px solid var(--line2);border-radius:14px;padding:11px 13px;margin-bottom:9px;
  border-left:5px solid var(--pc);position:relative;overflow:hidden}
.pcard:active{background:#fff}
.pctop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pname{font-weight:900;font-size:16px;display:flex;align-items:center;gap:7px}
.pdot{width:13px;height:13px;border-radius:4px;transform:rotate(45deg);background:var(--pc);flex:none}
.pnet{font-weight:900;font-size:18px;color:var(--ink);text-align:left;line-height:1}
.pnet small{display:block;font-size:9.5px;color:var(--muted);font-weight:700;margin-top:2px}
.pbar{height:7px;border-radius:4px;background:var(--line);margin:9px 0 8px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:4px;background:var(--pc);transition:width .4s ease}
.pbar.win i{background:linear-gradient(90deg,var(--gold),var(--red))}
.pstats{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:8px;background:var(--paper);color:var(--soft);
  display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line)}
.chip b{font-weight:900;color:var(--ink)}
.chip.cash b{color:var(--gold)}
.chip.cash.broke{background:#FBE6E6;border-color:var(--red)}
.chip.cash.broke b,.chip.cash.broke .riyal{color:var(--red)}
.chip.bless{background:#FBF1D6;color:var(--gold);border-color:var(--gold)}
.win-flag{position:absolute;top:0;right:0;background:var(--gold);color:#fff;font-size:10px;font-weight:900;
  padding:3px 10px;border-bottom-left-radius:10px;letter-spacing:.05em}

/* lands */
.terr{margin-bottom:14px}
.terrhead{display:flex;align-items:baseline;gap:7px;margin:2px 3px 7px;direction:rtl}
.terrhead b{font-weight:900;font-size:13.5px;color:var(--soft)}
.terrhead span{font-size:10.5px;color:var(--muted);font-weight:600}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.lcard{background:var(--stock);border:1px solid var(--line2);border-radius:12px;padding:8px 9px;
  border-top:4px solid var(--tc);position:relative;min-height:80px;display:flex;flex-direction:column;justify-content:space-between}
.lcard:active{transform:scale(.98)}
.lc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:4px}
.lc-name{font-weight:900;font-size:13px;direction:rtl;line-height:1.15;color:var(--ink)}
.lc-gly{width:22px;height:22px;color:var(--tc);flex:none;opacity:.9}
.lc-bot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px;gap:4px}
.lc-rent{font-weight:900;font-size:15px}
.lc-rent.pos{color:var(--pos)}.lc-rent.neg{color:var(--neg)}.lc-rent.zero{color:var(--muted)}
.lc-rent small{font-size:9px;font-weight:700;color:var(--muted);display:block;margin-bottom:-1px}
.lc-buy{font-size:11px;font-weight:800;color:var(--soft);background:var(--paper);border:1px solid var(--line);
  border-radius:7px;padding:3px 7px}
.lc-paybtn{font-weight:900;font-size:14px;color:#fff;background:var(--pos);border-radius:9px;padding:5px 9px;line-height:1.05;text-align:center}
.lc-paybtn small{display:block;font-size:9px;font-weight:800;opacity:.9}
.lc-paybtn:active{transform:scale(.95)}
.lc-owner{font-size:11px;font-weight:900;color:#fff;border-radius:7px;padding:3px 8px;background:var(--oc)}
.devbadge{position:absolute;top:5px;right:6px;font-size:9px;font-weight:900;background:var(--gold);color:#fff;
  border-radius:6px;padding:1px 5px;letter-spacing:.03em}
.lcard.owned{background:linear-gradient(180deg,var(--stock),#fff);box-shadow:inset 0 0 0 1.5px var(--oc)}

/* ===== the deck (drawer) — Najdi card stock, from cards.html ===== */
.deckwrap{display:flex;flex-direction:column;align-items:center;gap:13px;padding-top:4px}
.cardview{width:208px;max-width:64vw;perspective:1000px;cursor:pointer}
.cardview .card{animation:flipin .3s ease}
@keyframes flipin{from{transform:rotateY(-80deg);opacity:.25}to{transform:rotateY(0);opacity:1}}
.drawmsg{text-align:center;min-height:28px}
.drawmsg .mv{display:block;font-weight:900;font-size:22px;color:var(--ink);line-height:1.1}
.drawmsg .msg{font-size:13px;font-weight:700;color:var(--soft);direction:rtl}
.drawmsg.muted{color:var(--muted);font-weight:600;font-size:13px;max-width:300px;line-height:1.5}
.drawctl{display:flex;gap:8px;width:100%}
.drawctl.col{flex-direction:column;align-items:stretch}
.drawctl .ctl-q{font-size:12.5px;font-weight:800;color:var(--soft);text-align:center;direction:rtl}
.drawctl .pickrow{justify-content:center}
.drawctl>button{flex:1}
.deckcount{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;direction:rtl;font-variant-numeric:tabular-nums}
.deckcount b{color:var(--soft)}

.card{position:relative;width:100%;aspect-ratio:5/7;background:#FFFDF2;border:1.5px solid var(--ink);
  border-radius:12px;box-shadow:0 2px 9px rgba(25,20,9,.14);padding:7px;--suit:var(--red)}
.card .fr{position:relative;height:100%;border:1px solid var(--line2);border-radius:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 12px;text-align:center;color:var(--suit)}
.tband{position:absolute;left:9px;right:9px;height:8px;background:currentColor;
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 8'><path d='M0 8L8 0L16 8Z'/></svg>") 50% 0/16px 100% repeat-x;
          mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 8'><path d='M0 8L8 0L16 8Z'/></svg>") 50% 0/16px 100% repeat-x}
.tband.t{top:9px;transform:scaleY(-1)}
.tband.b{bottom:9px}
.ix{position:absolute;top:17px;left:14px;line-height:1;color:var(--suit);font-family:'ThmanyahSS01','Thmanyah',sans-serif;font-weight:900;font-size:19px}
.ix.flip{top:auto;left:auto;bottom:17px;right:14px;transform:rotate(180deg)}
.orn{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--suit)}
.orn i{width:6px;height:6px;transform:rotate(45deg);border:1.5px solid currentColor}
.orn i.f{background:currentColor;width:7px;height:7px;border:none}
.orn b{width:19px;height:19px;transform:rotate(45deg);border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.orn b span{transform:rotate(-45deg);font-weight:900;font-size:10.5px;line-height:1}
.orn.mid{margin-top:14px}
.card .pip{font-family:'ThmanyahSS01','Thmanyah',sans-serif;font-weight:900;font-size:102px;line-height:1;color:var(--suit);margin:10px 0 14px}
.card .word{font-family:'ThmanyahSS01','Thmanyah',sans-serif;font-weight:900;font-size:40px;line-height:1.2;direction:rtl;color:var(--suit)}
.card .word .yk{display:block;font-weight:400;font-size:16px;line-height:1;opacity:.55;margin-bottom:2px}
.card .fx{font-size:10.5px;line-height:1.6;color:var(--soft);margin-top:13px;direction:rtl}
.card .fx b{color:var(--ink);white-space:nowrap;direction:ltr;unicode-bidi:isolate;font-weight:900}
.kcard{--suit:var(--gold)}.qcard{--suit:var(--slate)}.jcard{--suit:#177A42}
.gup{color:var(--gold);font-weight:900}.gdn{color:var(--slate);font-weight:900}
.card.back{background:var(--red);border-color:#70090E}
.back .fr{border-color:rgba(250,245,230,.55);color:var(--paper)}
.back .fr::after{content:"";position:absolute;inset:3px;border:1px solid rgba(250,245,230,.3);border-radius:4px;pointer-events:none}
.back .orn{color:var(--paper)}
.back .bwm{font-family:'ThmanyahSS01','Thmanyah',sans-serif;font-weight:900;font-size:42px;color:var(--paper);direction:rtl;margin:16px 0}

/* harvest */
.hv-row{background:var(--stock);border:1px solid var(--line2);border-radius:13px;padding:11px 13px;margin-bottom:9px;
  border-left:5px solid var(--pc)}
.hv-top{display:flex;justify-content:space-between;align-items:center}
.hv-name{font-weight:900;font-size:15px;display:flex;align-items:center;gap:7px}
.hv-tot{font-weight:900;font-size:18px}
.hv-tot.pos{color:var(--pos)}.hv-tot.neg{color:var(--neg)}
.hv-break{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:5px;direction:rtl;line-height:1.5}
.hv-bless{font-size:11px;font-weight:900;color:var(--gold);margin-top:4px;direction:rtl}
.hv-warn{font-size:11px;font-weight:900;color:var(--red);margin-top:5px;direction:rtl}

/* rules accordion */
.rule{background:var(--stock);border:1px solid var(--line2);border-radius:13px;margin-bottom:8px;overflow:hidden}
.rsum{padding:14px;font-weight:900;font-size:14.5px;direction:rtl;text-align:right;list-style:none;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:50px;color:var(--ink)}
.rsum::-webkit-details-marker{display:none}
.rsum::after{content:'▾';color:var(--muted);font-size:12px;font-weight:700;flex:none}
.rule[open] .rsum{border-bottom:1px solid var(--line)}
.rule[open] .rsum::after{content:'▴'}
.rsum:active{background:var(--paper)}
.rbody{padding:12px 14px 14px;font-size:13px;font-weight:500;color:var(--soft);line-height:1.65;direction:rtl;text-align:right}
.rbody b{font-weight:900;color:var(--ink)}
.rbody ul{margin:0;padding:0;list-style:none}
.rbody li{margin:4px 0;padding-right:14px;position:relative}
.rbody li::before{content:'·';position:absolute;right:3px;color:var(--gold);font-weight:900}
.rbody .step{counter-increment:st;padding-right:24px}
.rbody .step::before{content:counter(st);position:absolute;right:0;top:0;width:18px;height:18px;border-radius:6px;
  background:var(--ink);color:var(--stock);font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center}
.rbody ol{counter-reset:st;margin:0;padding:0;list-style:none}
.rtable{width:100%;border-collapse:collapse;direction:rtl;font-size:12px;font-variant-numeric:tabular-nums}
.rtable th,.rtable td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}
.rtable th{font-size:10px;color:var(--muted);font-weight:800;line-height:1.2}
.rtable th small{font-weight:600;font-size:8px;color:var(--muted)}
.rtable .rt-n{font-weight:900;color:var(--ink);text-align:right;white-space:nowrap}
.rtable tbody tr:last-child td{border-bottom:none}
.rtable .neg{color:var(--neg)}

/* buttons */
.bigbtn{width:100%;padding:15px;border-radius:14px;background:var(--ink);color:var(--stock);font-weight:900;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;min-height:52px}
.bigbtn:active{transform:scale(.985)}
.bigbtn.gold{background:var(--gold)}
.bigbtn[disabled]{opacity:.4}
.ghostbtn{width:100%;padding:13px;border-radius:13px;border:1.5px solid var(--line2);background:var(--stock);
  font-weight:800;font-size:14px;color:var(--soft);margin-top:8px;min-height:48px}

/* bottom nav */
.nav{flex:none;display:flex;border-top:1px solid var(--line2);background:var(--stock);
  padding-bottom:env(safe-area-inset-bottom)}
.navb{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-weight:700}
.navb .ni{font-size:18px;line-height:1}
.navb .nl{font-size:9.5px}
.navb.on{color:var(--red)}

/* modal / sheet */
.scrim{position:fixed;inset:0;background:rgba(25,20,9,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;background:var(--paper);border-radius:20px 20px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;transform:translateY(100%);transition:transform .26s cubic-bezier(.3,.8,.3,1)}
.scrim.show .sheet{transform:translateY(0)}
.grip{width:38px;height:4px;border-radius:3px;background:var(--line2);margin:6px auto 12px}
.sh-title{font-weight:900;font-size:20px;direction:rtl;text-align:right;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sh-sub{font-size:12.5px;color:var(--muted);font-weight:600;direction:rtl;text-align:right;margin-top:2px;margin-bottom:12px}
.sh-tag{font-size:11px;font-weight:900;color:#fff;border-radius:8px;padding:3px 9px;background:var(--tc)}

.numgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.numcell{background:var(--stock);border:1px solid var(--line2);border-radius:11px;padding:8px 4px;text-align:center}
.numcell.on{border-color:var(--accent);border-width:2px;background:#fff}
.numcell .nlbl{font-size:9.5px;font-weight:700;color:var(--muted);direction:rtl}
.numcell .nval{font-weight:900;font-size:16px;margin-top:2px}
.numcell .nval.pos{color:var(--pos)}.numcell .nval.neg{color:var(--neg)}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 2px;font-weight:700;color:var(--soft)}
.kv+.kv{border-top:1px solid var(--line)}
.kv b{font-weight:900;color:var(--ink)}
.kv.tap:active{background:var(--line)}

.act-label{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.04em;margin:14px 2px 7px;direction:rtl;text-align:right}
.pickrow{display:flex;flex-wrap:wrap;gap:7px}
.pick{padding:12px 14px;min-height:48px;border-radius:12px;border:1.5px solid var(--pc);background:var(--stock);font-weight:900;font-size:14.5px;
  display:flex;align-items:center;gap:7px;color:var(--ink)}
.pick:active{background:var(--pc);color:#fff}
.pick:active .pcash{color:rgba(255,255,255,.8)}
.pick .pdot{width:11px;height:11px}
.pick .pcash{color:var(--muted);font-size:12px;font-weight:700}
.actbtns{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.arow{display:flex;gap:8px}
.arow>button{flex:1}
.abtn{padding:13px;border-radius:12px;font-weight:900;font-size:14px;border:1.5px solid var(--line2);background:var(--stock);color:var(--ink);min-height:50px}
.abtn:active{transform:scale(.98)}
.abtn.prime{background:var(--ink);color:var(--stock);border-color:var(--ink)}
.abtn.g{background:var(--gold);color:#fff;border-color:var(--gold)}
.abtn.r{background:var(--red);color:#fff;border-color:var(--red)}
.abtn.s{background:var(--slate);color:#fff;border-color:var(--slate)}
.abtn small{display:block;font-weight:700;font-size:10px;opacity:.85;margin-top:1px}
.detbtn{width:100%;text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding:10px;margin-top:6px}
.note{font-size:11px;color:var(--muted);font-weight:600;direction:rtl;text-align:right;margin-top:10px;line-height:1.4}

.stepper{display:flex;align-items:center;border:1.5px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--stock)}
.stepper button{width:50px;height:50px;font-size:24px;font-weight:900;color:var(--soft);background:var(--paper)}
.stepper button:active{background:var(--line)}
.stepper input{flex:1;text-align:center;font-weight:900;font-size:19px;border:none;background:transparent;width:100%;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.fieldlbl{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.04em;margin:12px 2px 6px;direction:rtl;text-align:right}

/* setup */
.setup{padding:24px 18px;height:100%;overflow-y:auto;display:flex;flex-direction:column}
.setup .logo{text-align:center;margin:18px 0 4px}
.setup .wordmark{font-family:'ThmanyahSS01','Thmanyah',sans-serif;font-weight:900;font-size:58px;color:var(--red);direction:rtl;line-height:1}
.setup .tag{text-align:center;font-family:'ThmanyahSS01','Thmanyah',sans-serif;font-weight:900;font-size:18px;color:var(--red);direction:rtl;margin-bottom:4px}
.setup .sub{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:22px;line-height:1.5}
.prow{display:flex;flex-direction:column;gap:10px;background:var(--stock);border:1px solid var(--line2);border-radius:14px;padding:11px 13px;margin-bottom:10px}
.prtop{display:flex;align-items:center;gap:8px}
.prow input{flex:1;border:none;background:transparent;font-family:inherit;font-weight:800;font-size:17px;color:var(--ink);padding:8px 2px;min-width:0}
.prow input:focus{outline:none}
.swatches{display:flex;gap:6px;flex:none}
.sw{width:34px;height:34px;border-radius:9px;background:var(--c);border:2px solid transparent}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--stock) inset}
.sw.taken{opacity:.25}
.delp{color:var(--muted);font-size:20px;width:40px;height:40px;text-align:center}
.addp{width:100%;padding:13px;border-radius:12px;border:1.5px dashed var(--line2);background:transparent;color:var(--soft);font-weight:800;font-size:14px;margin-top:2px;min-height:48px}

.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 80px);left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--stock);font-weight:800;font-size:13px;padding:11px 18px;border-radius:12px;z-index:60;
  opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

<script>
"use strict";
/* AWALAH companion banker — v5 economy · قلعة طويق board (22 businesses).
   All money in "k" (thousands). Start 200 · win 1000 (=1,000,000). */

const TYPES = {
  farm: {ar:'مزرعة', gly:'g-farm', col:'var(--farm)',
         buy:[14,20,26], rent:[-4,10,16], book:20, develop:30, sale:12},

         buy:[85,120,155],rent:[-15,40,60],book:120,develop:180,sale:55},
};
const GOLD  = [17,14,11];           // bust / normal / boom
const M_AR  = ['كساد','عادي','طفرة'];
const M_CLS = ['bust','norm','boom'];

const TERR = {1:{ar:'الوادي'},2:{ar:'السفوح العليا'},3:{ar:'بلدة السوق'},4:{ar:'القمة'}};
const BOARD = [
  {i:1, n:'تمور بريدة', t:'farm', terr:1},
  {i:2, n:'سوق الجردة', t:'souk', terr:1},
  {i:3, n:'شختك بختك', t:null, terr:1},
  {i:4, n:'كمأ الشمال', t:'farm', terr:1},
  {i:5, n:'سوق برزان', t:'souk', terr:1},
  {i:6, n:'سفر', t:null, terr:1},
  {i:7, n:'زيتون الجوف', t:'farm', terr:1},
  {i:8, n:'سوق أبا السعود', t:'souk', terr:1},
  {i:9, n:'عجوة المدينة', t:'farm', terr:1},
  {i:10,n:'سوق الثلاثاء', t:'souk', terr:2},
  {i:11,n:'رمان الباحة', t:'farm', terr:2},
  {i:12,n:'شختك بختك', t:null, terr:2},
  {i:13,n:'سوق البلد', t:'souk', terr:2},
  {i:14,n:'ورد الطائف', t:'farm', terr:2},
  {i:15,n:'بن الدائر', t:'farm', terr:2},
  {i:16,n:'سوق القطيف', t:'souk', terr:2},
  {i:17,n:'نخيل الأحساء', t:'farm', terr:2},
  {i:18,n:'سوق عكاظ', t:'souk', terr:3},

const PALETTE = ['#C9161D','#46536E','#5D8A35','#BE531C','#7A4FA0','#A87A0E'];

const KEY='awalah_companion_v1';
let state = load() || freshState();
let history = [];
let tab = 'players';
let draft = null;
let showDetail = false;   // land-sheet pricing detail toggle

function freshState(){
  return { started:false, market:1, round:1, players:[], deeds:{}, log:[], deck:[], discard:[], current:null };
}
function load(){ try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;} }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} }
function snap(){ history.push(JSON.stringify(state)); if(history.length>50)history.shift(); }
function undo(){ if(!history.length){toast('لا يوجد تراجع');return;} state=JSON.parse(history.pop()); closeSheet(); save(); render(); toast('تراجع ↺'); }

const $=(s,r=document)=>r.querySelector(s);
function k(n){ n=Math.round(n);
  if(Math.abs(n)>=1000){ let m=n/1000; return (Number.isInteger(m)?m:m.toFixed(2).replace(/\.?0+$/,''))+'M'; }
  return n+'k';
}
function signk(n){ return (n>0?'+':'')+k(n); }
function pById(id){ return state.players.find(p=>p.id===id); }
function biz(i){ return BOARD.find(b=>b.i===i); }
function deed(i){ return state.deeds[i]; }
function typeOf(i){ return TYPES[biz(i).t]; }

function buyPrice(i){ const d=deed(i),p=typeOf(i).buy[state.market]; return (d&&d.dev)?p*2:p; }
function rentNow(i){ const d=deed(i),r=typeOf(i).rent[state.market]; return (d&&d.dev)?r*2:r; }
function bookVal(i){ const d=deed(i),b=typeOf(i).book; return (d&&d.dev)?b*2:b; }
function sellVal(i){ const d=deed(i),t=typeOf(i); const v=state.market===0?t.sale:t.buy[state.market]; return (d&&d.dev)?v*2:v; }
function takeoverPrice(i){ return buyPrice(i)*2; }
function ownedBy(pid){ return BIZ.filter(b=>{const d=deed(b.i);return d&&d.owner===pid;}); }
function countType(pid,t){ return ownedBy(pid).filter(b=>b.t===t).length; }
function netWorth(p){ let s=p.cash+p.gold*GOLD[state.market]; ownedBy(p.id).forEach(b=>s+=bookVal(b.i)); return s; }
function winWorth(p){ let s=p.cash; ownedBy(p.id).forEach(b=>s+=bookVal(b.i)); return s; }

function logit(m){ state.log.unshift({m}); if(state.log.length>120)state.log.pop(); }
function commit(m){ if(m)logit(m); save(); render(); }

/* ============================ RENDER ============================ */
function render(){
  document.body.className='m'+state.market;
  const tc=['#E7E9EE','#FAF5E6','#FBF3DC'][state.market];
  const tm=document.querySelector('meta[name=theme-color]'); if(tm)tm.content=tc;
  const app=$('#app');
  if(!state.started){ app.innerHTML=setupView(); wireSetup(); return; }
  if(!Array.isArray(state.deck)){ initDeck(); save(); }
  app.innerHTML = topbar() + `<div class="content" id="content">${
      tab==='players'?playersTab(): tab==='lands'?landsTab(): tab==='cards'?cardsTab(): tab==='harvest'?harvestTab(): rulesTab()
    }</div>` + nav();
  wireMain();
}

/* ---------- HARVEST ---------- */
function harvestRows(){
  return state.players.map(p=>{
    const blessed = p.blessing>0 && state.market===0;
    const m = blessed?1:state.market;
    let total=0; const grp={farm:0,souk:0,house:0};
    ownedBy(p.id).forEach(b=>{ let r=typeOf(b.i).rent[m]; if(deed(b.i).dev)r*=2; total+=r; grp[b.t]+=r; });
    const parts=[];
    Object.entries(grp).forEach(([t,v])=>{ if(ownedBy(p.id).some(b=>b.t===t)) parts.push(`${TYPES[t].ar} ${signk(v)}`); });
    return {p,total,parts,blessed};
  });
}
function harvestTab(){
  const rows=harvestRows();
  let html=`<div class="sechead"><h2>الحصاد</h2><span class="hint">${M_AR[state.market]} · مرة كل جولة</span></div>`;
  rows.forEach(({p,total,parts,blessed})=>{
    const cls=total>0?'pos':total<0?'neg':'';
    const cantCover = total<0 && (p.cash+total)<0;
    html+=`<div class="hv-row" style="--pc:${p.hex}">
      <div class="hv-top"><div class="hv-name"><span class="pdot" style="background:${p.hex}"></span>${esc(p.name)}</div>
        <div class="hv-tot ${cls} tnum">${signk(total)}</div></div>
      <div class="hv-break ar">${parts.length?parts.join(' · '):'لا يملك مشاريع'}</div>
      ${blessed?`<div class="hv-bless">✦ بركة مستخدمة — يُسوّى على «عادي» رغم الكساد</div>`:''}
      ${cantCover?`<div class="hv-warn">⚠ الكاش ${k(p.cash)} لا يغطي — لازم يبيع مشروعًا (بسعر الكساد).</div>`:''}
    </div>`;
  });
  html+=`<button class="bigbtn gold" id="harvestApply">🌾 طبّق الحصاد · ابدأ الجولة ${state.round+1}</button>`;
  return html;
}

  return `<div class="prow" data-d="${idx}">

      <input type="text" placeholder="اسم اللاعب ${idx+1}" value="${esc(p.name)}" data-name="${idx}" maxlength="14" autocomplete="off">
      ${draft.length>2?`<button class="delp" data-del="${idx}" aria-label="حذف">✕</button>`:''}
    </div>
    <div class="swatches">${PALETTE.map(hex=>{
      const taken = draft.some((d,j)=>j!==idx && d.hex===hex);
      return `<button class="sw ${hex===p.hex?'on':''} ${taken?'taken':''}" style="--c:${hex}" data-pick="${idx}" data-hex="${hex}" ${taken?'disabled':''}></button>`;
    }).join('')}</div>

}
function wireSetup(){
  $('#draftList').querySelectorAll('[data-name]').forEach(inp=>inp.addEventListener('input',e=>{draft[+e.target.dataset.name].name=e.target.value;}));
  $('#draftList').querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{draft[+b.dataset.pick].hex=b.dataset.hex;rerenderSetup();}));
  $('#draftList').querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{draft.splice(+b.dataset.del,1);rerenderSetup();}));
  const add=$('#addPlayer'); if(add)add.addEventListener('click',()=>{
    const used=draft.map(d=>d.hex); const free=PALETTE.find(c=>!used.includes(c))||PALETTE[draft.length%6];
    draft.push({name:'',hex:free}); rerenderSetup();});
  $('#startGame').addEventListener('click',startGame);
}
function rerenderSetup(){ const a=document.activeElement, di=a&&a.dataset?a.dataset.name:null;
  $('#app').innerHTML=setupView(); wireSetup();
  if(di!=null){const el=$(`[data-name="${di}"]`); if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}} }
function pid(idx){ return 'p'+idx+'_'+Math.floor(performance.now()).toString(36); }
function startGame(){
  state.players = draft.map((d,idx)=>({id:pid(idx), name:(d.name.trim()||'لاعب '+(idx+1)), hex:d.hex, cash:200, gold:0, blessing:0}));
  state.started=true; history=[]; initDeck(); logit('بدأت اللعبة — '+state.players.length+' لاعبين'); save(); render();
}

/* ============================ WIRING ============================ */
function wireMain(){
  $('#undoBtn').addEventListener('click',undo);
  $('#menuBtn').addEventListener('click',openMenu);
  document.querySelectorAll('.mseg').forEach(b=>b.addEventListener('click',()=>setMarket(+b.dataset.m)));
  document.querySelectorAll('.navb').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render();}));
  if(tab==='players') document.querySelectorAll('[data-player]').forEach(c=>c.addEventListener('click',()=>openPlayer(c.dataset.player)));
  if(tab==='lands'){
    document.querySelectorAll('[data-land]').forEach(c=>c.addEventListener('click',()=>openLand(+c.dataset.land)));
    document.querySelectorAll('[data-pay]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();openPayRent(+btn.dataset.pay);}));
  }
  if(tab==='cards'){
    const c=state.current, pending=c&&c.t==='jack'&&!c.r;
    const db=$('#drawBtn'); if(db&&!pending)db.addEventListener('click',drawCard);
    const cv=$('#cardview'); if(cv&&!pending)cv.addEventListener('click',drawCard);
    document.querySelectorAll('[data-spec]').forEach(b=>b.addEventListener('click',()=>resolveSpec(b.dataset.spec)));
    document.querySelectorAll('[data-gift]').forEach(b=>b.addEventListener('click',()=>resolveGift(b.dataset.gift)));
    document.querySelectorAll('[data-sad]').forEach(b=>b.addEventListener('click',()=>resolveSadaqah(b.dataset.sad)));
    const ss=$('#sadSkip'); if(ss)ss.addEventListener('click',()=>resolveSadaqah(null));
  }
  if(tab==='harvest') $('#harvestApply').addEventListener('click',applyHarvest);
}
function setMarket(m){ if(m===state.market)return; snap(); state.market=m; commit('السوق → '+M_AR[m]); toast('السوق: '+M_AR[m]); }

/* ============================ EVENTS ============================ */
function allCash(d){ state.players.forEach(p=>p.cash+=d); }
function buildDeck(){
  const c=[], nums={1:8,2:7,3:7,4:7,5:7,6:8};
  for(const v in nums) for(let i=0;i<nums[v];i++) c.push({t:'num',v:+v});
  for(let i=0;i<5;i++) c.push({t:'king'});
  for(let i=0;i<5;i++) c.push({t:'queen'});
  ['hunger','locust','flood','plenty','sadaqah','rumor','spec','gift'].forEach(j=>c.push({t:'jack',j}));
  return c;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function initDeck(){ state.deck=shuffle(buildDeck()); state.discard=[]; state.current=null; }
function cardName(c){ return c.t==='num'?('رقم '+c.v): c.t==='king'?'طفرة (ملك)': c.t==='queen'?'كساد (ملكة)': JACK[c.j].w; }
function drawCard(){
  if(state.current && state.current.t==='jack' && !state.current.r) return; // resolve first
  snap();
  if(!state.deck.length){
    const all=state.discard.concat(state.current?[state.current]:[]);
    state.deck=shuffle(all); state.discard=[]; state.current=null; toast('🔀 خُلط الكوت');
  }
  if(state.current) state.discard.push(state.current);
  const c={...state.deck.shift(), r:true, msg:''};
  state.current=c;
  if(c.t==='king'){ if(state.market===2){allCash(6);c.msg='الطفرة: +6 للجميع';} else {state.market++;c.msg='السوق → '+M_AR[state.market];} }
  else if(c.t==='queen'){ if(state.market===0){allCash(-6);c.msg='الكساد: −6 للجميع';} else {state.market--;c.msg='السوق → '+M_AR[state.market];} }
  else if(c.t==='jack'){ const j=c.j;
    if(j==='hunger'){state.players.forEach(p=>p.cash-=20*countType(p.id,'house'));c.msg='−20 لكل عقار';}
    else if(j==='locust'){state.players.forEach(p=>p.cash-=6*countType(p.id,'farm'));c.msg='−6 لكل مزرعة';}
    else if(j==='flood'){state.players.forEach(p=>p.cash-=15*countType(p.id,'souk'));c.msg='−15 لكل متجر';}
    else if(j==='plenty'){allCash(18);c.msg='+18 للجميع';}
    else if(j==='rumor'){ if(state.market===2){allCash(6);c.msg='إشاعة: +6 للجميع';} else if(state.market===0){allCash(-6);c.msg='إشاعة: −6 للجميع';} else c.msg='إشاعة: لا أثر (عادي)'; }
    else { c.r=false; c.msg='اختر أدناه ↓'; }   // spec / gift / sadaqah
  }
  logit('🃏 '+cardName(c)); save(); render();
  if(c.r && c.t!=='num' && c.msg) toast(c.msg);
}
function resolveSpec(dir){ state.market=Math.max(0,Math.min(2,state.market+(dir==='up'?1:-1)));
  state.current.r=true; state.current.msg='السوق → '+M_AR[state.market]; save(); render(); toast('السوق: '+M_AR[state.market]); }
function resolveGift(gid){ const others=state.players.filter(p=>p.id!==gid); others.forEach(p=>p.cash-=10); pById(gid).cash+=10*others.length;
  state.current.r=true; state.current.msg='+'+k(10*others.length)+' لـ '+pById(gid).name; save(); render(); toast('عيدية'); }
function resolveSadaqah(sid){ if(sid){ pById(sid).cash-=10; pById(sid).blessing=(pById(sid).blessing||0)+1; state.current.msg=pById(sid).name+' −10 ← بركة'; }
  else state.current.msg='لم يتصدّق أحد'; state.current.r=true; save(); render(); toast(sid?'بركة ✦':'تُخطّيت'); }

/* ============================ HARVEST apply ============================ */
function applyHarvest(){
  snap();
  harvestRows().forEach(({p,total,blessed})=>{ const pl=pById(p.id); pl.cash+=total; if(blessed)pl.blessing--; });
  state.round++;
  logit('🌾 حصاد جولة '+(state.round-1)+' ('+M_AR[state.market]+')');
  tab='players'; save(); render();
  toast('تم الحصاد · جولة '+state.round);
}

      <button class="abtn g" id="aGold">🪙 تداول ذهب</button>

function openGold(id){

    <div class="actbtns" style="margin-top:12px"><div class="arow">
      <button class="abtn g" id="gBuy">شراء ⬆</button>

    </div></div>

  $('#gSell').addEventListener('click',()=>{const n=Math.min(Math.max(1,parseInt(q.value)||1),p.gold);snap();p.cash+=n*price;p.gold-=n;commit(esc(p.name)+' باع '+n+' ذهب (+'+k(n*price)+')');closeSheet();toast('+'+k(n*price)+' كاش');});
}

/* ============================ LAND SHEET ============================ */
function openLand(i){
  const b=biz(i); if(!b.t) return;
  const d=deed(i), t=typeOf(i), own=d&&d.owner!=null?pById(d.owner):null;
  const rents=t.rent.map(r=>(d&&d.dev)?r*2:r);

  let body=`<div class="sh-title"><span class="ar">${b.n} ${d&&d.dev?'🏗️':''}</span><span class="sh-tag" style="--tc:${t.col}">${t.ar}</span></div>
    <div class="sh-sub ar">${TERR[b.terr].ar}${own?` · يملكها ${esc(own.name)}`:' · غير مملوكة'}</div>`;

  if(!own){
    body+=`<div class="act-label">شراء بسعر ${k(buyPrice(i))} (${M_AR[state.market]}) — من اشتراها؟</div>
      <div class="pickrow">${pickRowsHTML(state.players,'buy',true)}</div>
      <button class="ghostbtn" id="auctionBtn">↯ مزاد لأي لاعب بسعر مخصّص</button>`;
  } else {
    const others=state.players.filter(p=>p.id!==own.id);
    body+=`<div class="actbtns">
      <div class="arow">
        <button class="abtn prime" id="payRent" ${rentNow(i)<=0?'disabled':''}>💰 دفع ريع<small>${rentNow(i)>0?'+'+k(rentNow(i))+' للمالك':'لا ريع في '+M_AR[state.market]}</small></button>
        <button class="abtn g" id="devBtn" ${d.dev?'disabled':''}>🏗️ تطوير<small>${d.dev?'مطوّرة':'−'+k(t.develop)}</small></button>
      </div>
      <div class="arow">
        <button class="abtn" id="sellBtn">💵 بيع للبنك<small>+${k(sellVal(i))}${state.market===0?' (كساد)':''}</small></button>
        <button class="abtn r" id="takeoverBtn" ${others.length?'':'disabled'}>⚔️ استحواذ<small>2× = ${k(takeoverPrice(i))}</small></button>
      </div>
    </div>`;
  }

  body+=`<button class="detbtn" id="detToggle">${showDetail?'▴ إخفاء تفاصيل السعر':'▾ تفاصيل السعر (كل الحالات)'}</button>`;
  if(showDetail){
    body+=`<div class="numgrid">${[0,1,2].map(m=>`<div class="numcell ${m===state.market?'on':''}">
        <div class="nlbl ar">ريع ${M_AR[m]}</div><div class="nval ${rents[m]>0?'pos':rents[m]<0?'neg':''}">${signk(rents[m])}</div></div>`).join('')}</div>
      <div class="kv"><span>قيمة دفترية (للفوز)</span><b>${k(bookVal(i))}</b></div>
      <div class="kv"><span>تكلفة التطوير</span><b>${k(t.develop)}</b></div>
      <div class="kv"><span>بيع للبنك الآن</span><b>${k(sellVal(i))}${state.market===0?' (سعر كساد)':''}</b></div>`;
  }
  sheet(body);

  $('#detToggle').addEventListener('click',()=>{showDetail=!showDetail;openLand(i);});
  if(!own){
    document.querySelectorAll('[data-buy]').forEach(btn=>btn.addEventListener('click',()=>{
      const buyer=btn.dataset.buy, price=buyPrice(i); snap(); pById(buyer).cash-=price; state.deeds[i]={owner:buyer,dev:false};
      commit(esc(pById(buyer).name)+' اشترى '+b.n+' (−'+k(price)+')'); closeSheet(); toast('تم الشراء'); }));
    $('#auctionBtn').addEventListener('click',()=>openAuction(i));
  } else {
    const oid=own.id;
    const pr=$('#payRent'); if(pr)pr.addEventListener('click',()=>openPayRent(i));
    const dv=$('#devBtn'); if(dv)dv.addEventListener('click',()=>{ snap(); pById(oid).cash-=t.develop; state.deeds[i].dev=true;
      commit(esc(pById(oid).name)+' طوّر '+b.n+' (−'+k(t.develop)+')'); closeSheet(); toast('🏗️ طُوّرت'); });
    $('#sellBtn').addEventListener('click',()=>{ const v=sellVal(i); snap(); pById(oid).cash+=v; delete state.deeds[i];
      commit(esc(pById(oid).name)+' باع '+b.n+' (+'+k(v)+')'); closeSheet(); toast('+'+k(v)+' كاش'); });
    const tk=$('#takeoverBtn'); if(tk)tk.addEventListener('click',()=>openTakeover(i));
  }
}

      <button class="abtn" id="rsNo">إلغاء</button>
    </div>`);
  $('#rsFull').addEventListener('click',()=>{ state=freshState(); draft=null; history=[]; save(); closeSheet(); render(); });
  $('#rsKeep').addEventListener('click',()=>{
    const ps=state.players.map(p=>({name:p.name,hex:p.hex}));
    state=freshState(); history=[];
    state.players=ps.map((d,idx)=>({id:pid(idx),name:d.name,hex:d.hex,cash:200,gold:0,blessing:0}));
    state.started=true; initDeck(); logit('لعبة جديدة بنفس اللاعبين'); save(); closeSheet(); tab='players'; render();
  });
  $('#rsNo').addEventListener('click',openMenu);
}

/* ============================ SHEET / TOAST ============================ */
function sheet(html){ $('#sheet').innerHTML=`<div class="grip"></div>`+html; $('#scrim').classList.add('show'); }
function closeSheet(){ $('#scrim').classList.remove('show'); }
$('#scrim').addEventListener('click',e=>{ if(e.target.id==='scrim')closeSheet(); });
let toastT;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1700); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

render();
</script>
